nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  keyVaults:
    darts:
      secrets:
        - name: AppInsightsInstrumentationKey
          alias: AppInsightsInstrumentationKey
        - name: redis-connection-string
          alias: redis-connection-string
        - name: darts-portal-session-secret
          alias: darts-portal-session-secret
        - name: DevLaunchDarklyClientId
          alias: LaunchDarklyClientId
        - name: DevLaunchDarklySdkKey
          alias: LaunchDarklySdkKey
  environment:
    DARTS_API_URL: https://darts-api.staging.platform.hmcts.net
    DARTS_PORTAL_URL: https://${SERVICE_FQDN}
    MANUAL_DELETION_ENABLED: true
    EVENT_OBFUSCATION_ENABLED: true
    PAGINATION_CASE_AUDIOS_LIMIT: 5