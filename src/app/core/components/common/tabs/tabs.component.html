<nav class="moj-sub-navigation" aria-label="Sub navigation">
  <ul class="moj-sub-navigation__list">
    @for (tab of tabs(); track tab) {
      <li class="moj-sub-navigation__item">
        <a
          class="moj-sub-navigation__link"
          [attr.aria-current]="tab.template === currentTab() ? 'page' : null"
          [id]="tab.id || null"
          href="#"
          (click)="onTabClick($event, tab)"
        >
          @if (tab.screenReaderText) {
            <span class="govuk-visually-hidden">{{ tab.screenReaderText }}</span>
          }
          {{ tab.name }}
          @if (tab.count) {
            <span class="moj-notification-badge count">
              {{ tab.count }}
            </span>
          }
        </a>
      </li>
    }
  </ul>
</nav>

<div class="tab-container">
  <ng-container [ngTemplateOutlet]="currentTab()"></ng-container>
</div>
